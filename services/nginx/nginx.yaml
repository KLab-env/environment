services:
  nginx:
    image: nginx
    container_name: nginx
    volumes:
      - /opt/services/nginx/templates:/etc/nginx/templates
      - /opt/services/nginx/conf/default_nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=klab.home
      - NGINX_PORT=80
      - PUID=1001
      - PGID=1001
      - TZ=America/Toronto